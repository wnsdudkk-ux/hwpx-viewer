<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한글(.hwpx) 보고서를 휴대폰에서 한글 프로그램과 같은 줄 배치로 보는 뷰어">
<meta name="theme-color" content="#FAFBFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B25" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HWPX 뷰어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HWPX 보고서 뷰어</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* 배치: 책상 위에 쪽을 차례로 펼친다. 도구는 위쪽 띠와 아래쪽 손잡이에만 둔다. */
  :root {
    --desk: #E4E8EF;
    --surface: #FAFBFD;
    --surface-2: #EEF1F6;
    --ink: #151C2A;
    --muted: #5A6375;
    --line: #D1D7E1;
    --accent: #1F3A8A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E1E8F8;
    --band: #0A33A9;
    --warn: #8A5300;
    --scrim: rgba(12, 17, 28, 0.42);
    --paper-edge: rgba(18, 27, 46, 0.14);
    --paper-shadow: 0 1px 2px rgba(18, 27, 46, 0.10), 0 8px 24px rgba(18, 27, 46, 0.10);
    --font-ui: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --font-doc: 'HwpxViewer Myeongjo', 'Noto Serif CJK KR', serif;
    --radius: 10px;
    --bar-h: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0E121A;
      --surface: #161B25;
      --surface-2: #1E2532;
      --ink: #E6E9F0;
      --muted: #9AA3B5;
      --line: #2A3242;
      --accent: #9DB3F4;
      --accent-ink: #0D1426;
      --accent-soft: #212E4D;
      --band: #6D8BEA;
      --warn: #E2B45C;
      --scrim: rgba(0, 0, 0, 0.55);
      --paper-edge: rgba(0, 0, 0, 0.5);
      --paper-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0E121A;
    --surface: #161B25;
    --surface-2: #1E2532;
    --ink: #E6E9F0;
    --muted: #9AA3B5;
    --line: #2A3242;
    --accent: #9DB3F4;
    --accent-ink: #0D1426;
    --accent-soft: #212E4D;
    --band: #6D8BEA;
    --warn: #E2B45C;
    --scrim: rgba(0, 0, 0, 0.55);
    --paper-edge: rgba(0, 0, 0, 0.5);
    --paper-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--surface);
  }
  button { font: inherit; color: inherit; }
  .app { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  /* 위쪽 띠 */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--bar-h);
    padding-block: 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .mark { flex: none; width: 26px; height: 32px; display: block; }
  .doc-name {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .doc-name strong {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .doc-name span {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    vertical-align: 1px;
  }
  .btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn svg { width: 18px; height: 18px; }
  .icon-btn {
    flex: none;
    width: 40px;
    height: 40px;
    display: inline-grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    color: var(--ink);
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 20px; height: 20px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 쪽이 놓이는 책상 */
  .viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .stage {
    width: max-content;
    min-width: 100%;
    box-sizing: border-box;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 112px max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transform-origin: 0 0;
  }
  .page {
    position: relative;
    background: #FFFFFF;
    box-shadow: var(--paper-shadow);
    outline: 1px solid var(--paper-edge);
    flex: none;
  }
  .page svg { display: block; width: 100%; height: 100%; }
  .page text { -webkit-user-select: text; user-select: text; }

  .notice {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .notice p { margin: 0; flex: 1 1 220px; min-width: 0; }
  .notice b { color: var(--ink); font-weight: 600; }

  .state-card {
    max-width: 420px;
    margin: 12vh auto 0;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    text-align: left;
    display: grid;
    gap: 12px;
  }
  .state-card h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
  .state-card p { margin: 0; color: var(--muted); line-height: 1.6; }
  .state-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .loading { margin: 18vh auto 0; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .loading i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 아래쪽 손잡이 */
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 6px 22px rgba(10, 16, 30, 0.16);
    max-width: calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  }
  .dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .zoom-label {
    min-width: 56px;
    height: 40px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    font-size: 13px;
  }
  .zoom-label:hover { background: var(--surface-2); }
  .dock .label { font-size: 12px; margin-left: 2px; }
  @media (max-width: 380px) { .dock .label { display: none; } }

  /* 아래에서 올라오는 판 */
  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
  .sheet {
    position: fixed;
    z-index: 21;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(560px, 100%);
    max-height: min(78vh, 680px);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 40px rgba(10, 16, 30, 0.2);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    animation: rise 0.18s ease-out;
  }
  @keyframes rise { from { transform: translate(-50%, 24px); opacity: 0.4; } to { transform: translate(-50%, 0); opacity: 1; } }
  .sheet header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 8px 8px max(18px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--line);
  }
  .sheet h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  .sheet .body {
    overflow: auto;
    padding: 12px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px));
    display: grid;
    gap: 16px;
    min-height: 0;
  }
  .sheet h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .list button {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    line-height: 1.45;
  }
  .list button:hover { background: var(--surface-2); }
  .list .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .n { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .toc .lv0 .t { font-weight: 600; }
  .toc .lv1 { padding-left: 14px; }
  .toc .lv2 { padding-left: 28px; }
  .doc-row { display: flex; align-items: center; gap: 4px; }
  .doc-row > button:first-child { flex: 1; min-width: 0; }
  .list .doc-row .icon-btn { flex: none; width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; }
  .doc-row .meta { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; padding: 4px 2px; }
  dl.facts { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .fonts { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fonts td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .fonts td:first-child { padding-right: 12px; }
  .fonts td:last-child { color: var(--muted); }
  .fonts .arrow { color: var(--muted); padding: 6px 8px; }
  .note { margin: 0; font-size: 13px; line-height: 1.65; color: var(--muted); }
  .warn { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: var(--warn); }
  .drop {
    position: fixed;
    inset: 12px;
    z-index: 30;
    display: grid;
    place-items: center;
    border: 2px dashed var(--accent);
    border-radius: 18px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 25;
    max-width: calc(100vw - 48px);
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--surface);
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .loading i { animation: none; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 설치형 앱: 상태 표시줄 아래에서 시작하고, 설치 안내 띠를 위쪽 띠 밑에 둔다 */
  .app { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
  .install {
    display: flex;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: var(--accent-soft);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    line-height: 1.5;
  }
  .install p { margin: 0; flex: 1 1 220px; min-width: 0; }
  .install .row { display: flex; gap: 6px; margin-left: auto; }
  .install .btn { height: 34px; padding: 0 12px; }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <svg class="mark" viewBox="0 0 26 32" aria-hidden="true">
      <rect x="0.5" y="0.5" width="25" height="31" rx="2" fill="#FFFFFF" stroke="var(--line)"/>
      <rect x="4" y="6" width="18" height="2.4" fill="var(--band)"/>
      <rect x="6" y="10.4" width="14" height="2.2" rx="0.6" fill="#1B2232"/>
      <rect x="4" y="14.6" width="18" height="2.4" fill="var(--band)"/>
      <rect x="5" y="20.5" width="16" height="1.3" rx="0.6" fill="#9AA3B5"/>
      <rect x="5" y="23.6" width="12" height="1.3" rx="0.6" fill="#9AA3B5"/>
      <rect x="5" y="26.7" width="14" height="1.3" rx="0.6" fill="#9AA3B5"/>
    </svg>
    <div class="doc-name">
      <strong id="docTitle">HWPX 보고서 뷰어</strong>
      <span id="docSub">한글 보고서를 한글과 같은 줄 배치로 봅니다</span>
    </div>
    <button class="icon-btn" id="infoBtn" type="button" aria-label="문서 정보">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
    <button class="btn primary" id="openBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-8a1.5 1.5 0 0 0-1.5-1.5H12L10 6H5.5A1.5 1.5 0 0 0 4 7.5Z"/></svg>
      열기
    </button>
    <input type="file" id="fileInput" class="sr-only" tabindex="-1" aria-hidden="true">
  </header>

  <div class="install" id="install" role="region" aria-label="앱 설치 안내" hidden></div>

  <main class="viewer" id="viewer" aria-live="polite">
    <div class="stage" id="stage"></div>
  </main>

  <nav class="dock" id="dock" aria-label="보기 도구">
    <button class="icon-btn" id="tocBtn" type="button" aria-label="목차">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.1" fill="currentColor"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1.1" fill="currentColor"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="icon-btn" id="zoomOut" type="button" aria-label="작게">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button class="zoom-label" id="zoomFit" type="button" aria-label="화면 폭에 맞추기">맞춤</button>
    <button class="icon-btn" id="zoomIn" type="button" aria-label="크게">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button class="icon-btn" id="libBtn" type="button" aria-label="문서함">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6.5A1.5 1.5 0 0 1 5.5 5h4l2 2.2h7A1.5 1.5 0 0 1 20 8.7V17.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"/><path d="M4 10h16"/></svg>
    </button>
  </nav>
</div>

<div id="overlay"></div>

<script src="jszip.min.js"></script>
<script src="metrics.js"></script>
<script>window.HWPX_FONTS = {"serif": "'HwpxViewer Myeongjo', 'Noto Serif CJK KR', 'AppleMyungjo', 'Batang', serif", "gothic": "'HwpxViewer Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif", "sans": "'Noto Sans KR', 'HwpxViewer Gothic', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"};</script>
<script src="engine.js"></script>
<script src="pwa.js"></script>
<script>

  const store = (() => {
    let dbp = null;
    const open = () => {
      if (dbp) return dbp;
      dbp = new Promise((resolve) => {
        try {
          const req = indexedDB.open('hwpx-viewer', 1);
          req.onupgradeneeded = () => { try { req.result.createObjectStore('docs', { keyPath: 'id' }); } catch (e) { /* 이미 있음 */ } };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
          req.onblocked = () => resolve(null);
        } catch (e) { resolve(null); }
      });
      return dbp;
    };
    const tx = async (mode, fn) => {
      const db = await open();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const t = db.transaction('docs', mode);
          const s = t.objectStore('docs');
          const out = fn(s);
          t.oncomplete = () => resolve(out && 'result' in out ? out.result : true);
          t.onerror = () => resolve(null);
          t.onabort = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    };
    return {
      async list() {
        const all = await tx('readonly', (s) => s.getAll());
        return Array.isArray(all) ? all.sort((a, b) => b.openedAt - a.openedAt) : [];
      },
      async get(id) { return tx('readonly', (s) => s.get(id)); },
      async put(rec) {
        await tx('readwrite', (s) => s.put(rec));
        const all = await this.list();
        for (const old of all.slice(12)) await this.remove(old.id);
      },
      async remove(id) { return tx('readwrite', (s) => s.delete(id)); },
    };
  })();

  function b64ToBuffer(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  async function hashOf(buf) {
    try {
      const d = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(d).slice(0, 10)).map((b) => b.toString(16).padStart(2, '0')).join('');

  }
  function sizeText(n) {
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }
  function dateText(t) {
    const d = new Date(t);
    const now = new Date();
    const same = d.toDateString() === now.toDateString();
    const p = (x) => String(x).padStart(2, '0');
    return same ? `오늘 ${p(d.getHours())}:${p(d.getMinutes())}` : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  }

  function showLoading(name) {
    stage.innerHTML = `<div class="loading"><i aria-hidden="true"></i><span>${esc(name)} 쪽을 배치하는 중</span></div>`;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  async function openBuffer(buf, meta) {
    // 배치 중에 다른 문서가 들어오면(공유받은 파일 등) 지금 것이 끝난 뒤 이어서 연다
    if (state.busy) { state.pending = [buf, meta]; return; }
    state.busy = true;
    showLoading(meta.name);
    await new Promise((r) => setTimeout(r, 30));
    try {
      const pkg = await HwpxEngine.readPackage(buf);
      const doc = HwpxEngine.layoutDocument(pkg);
      for (const u of state.urls) URL.revokeObjectURL(u);
      state.urls = [];
      state.pkg = pkg; state.doc = doc; state.name = meta.name; state.sample = meta.sample || null;
      setTitle();
      renderDoc();
      viewer.scrollTop = 0; viewer.scrollLeft = 0;
      if (!meta.sample) {
        const id = meta.id || (await hashOf(buf));
        await store.put({ id, name: meta.name, size: buf.byteLength, openedAt: Date.now(), pages: doc.pages.length, data: buf });
        prefs.set('last', id);
      } else prefs.set('last', meta.sample);
    } catch (err) {
      showError(err, meta.name);
    } finally {
      state.busy = false;
      if (state.pending) { const next = state.pending; state.pending = null; openBuffer(next[0], next[1]); }
    }
  }
  function setTitle() {
    const doc = state.doc;
    const title = state.name.replace(/\.hwpx$/i, '');
    $('docTitle').innerHTML = esc(title) + (state.sample ? '<span class="tag">예시</span>' : '');
    document.title = title + ' - HWPX 보고서 뷰어';
    updateSub();
    void doc;
  }
  function updateSub() {
    const doc = state.doc;
    if (!doc) return;
    const p = doc.pages[0];
    const paper = p ? paperName(p.section) : '';
    $('docSub').textContent = `${state.current + 1} / ${doc.pages.length}쪽 · ${paper}`;
  }
  function paperName(S) {
    const mm = (v) => Math.round(v / 7200 * 25.4);
    const w = mm(S.width), h = mm(S.height);
    const names = { '210x297': 'A4', '148x210': 'A5', '182x257': 'B5', '257x364': 'B4', '216x279': 'Letter' };
    const key = Math.min(w, h) + 'x' + Math.max(w, h);
    const name = names[key] || `${w}×${h}mm`;
    return name + (w > h ? ' 가로' : ' 세로');
  }
  function showError(err, name) {
    const code = err && err.code;
    let title = '이 파일은 열 수 없습니다';
    let msg = (err && err.message) || '알 수 없는 문제로 문서를 읽지 못했습니다.';
    if (code === 'HWP5') title = '구형 한글 파일(.hwp)입니다';
    if (code === 'HWP5') msg = '이 뷰어는 .hwpx만 엽니다. 한글에서 [다른 이름으로 저장] → 파일 형식 HWPX로 저장한 뒤 다시 열어 주세요.';
    if (code === 'NOT_ZIP' || code === 'BAD_ZIP') msg = 'hwpx 파일이 아니거나 내려받기가 덜 끝난 파일입니다. 파일을 다시 받은 뒤 열어 주세요.';
    if (!code) msg = '문서 구조를 읽는 중에 문제가 생겼습니다. (' + msg + ')';
    stage.innerHTML = `<section class="state-card" role="alert"><h2>${esc(title)}</h2><p>${esc(name || '')}</p><p>${esc(msg)}</p><div class="row"><button class="btn primary" type="button" data-act="open">다른 파일 열기</button><button class="btn" type="button" data-act="sample">예시 보고서 보기</button></div></section>`;
    $('docTitle').textContent = 'HWPX 보고서 뷰어';
    $('docSub').textContent = '파일을 열지 못했습니다';
    state.doc = null;
  }

  // ------------------------------------------------------------------ 쪽 그리기
  function imageUrl(id) {
    const pkg = state.pkg;
    if (!pkg) return null;
    pkg.__urls = pkg.__urls || new Map();
    if (pkg.__urls.has(id)) return pkg.__urls.get(id);
    const b = pkg.bins.get(id);
    if (!b) return null;
    const url = URL.createObjectURL(new Blob([b.data], { type: b.type }));
    pkg.__urls.set(id, url);
    state.urls.push(url);
    return url;
  }
  function renderDoc() {
    const doc = state.doc;
    stage.innerHTML = '';
    if (state.sample) {
      const n = document.createElement('div');
      n.className = 'notice';
      n.innerHTML = '<p><b>예시 보고서</b>를 보여 주고 있습니다. 보고서 스킬이 만든 .hwpx 파일을 열면 이 자리에 같은 모양으로 펼쳐집니다.</p><button class="btn primary" type="button" data-act="open">내 파일 열기</button>';
      stage.appendChild(n);
      state.noticeEl = n;
    } else state.noticeEl = null;
    state.maxW = Math.max(...doc.pages.map((p) => p.section.width));
    state.pages = doc.pages.map((p) => {
      const el = document.createElement('div');
      el.className = 'page';
      el.dataset.index = p.index;
      el.style.aspectRatio = p.section.width + ' / ' + p.section.height;
      try { el.innerHTML = HwpxEngine.renderPageSvg(doc, p, { imageUrl }); } catch (err) {
        el.innerHTML = `<div style="padding:24px;color:#5A6375;font-size:13px">${p.index + 1}쪽을 그리지 못했습니다.</div>`;
        if (window.console) console.warn(err);
      }
      stage.appendChild(el);
      return el;
    });
    const saved = parseFloat(prefs.get('zoom'));
    state.zoom = Number.isFinite(saved) && saved >= MIN_ZOOM && saved <= MAX_ZOOM ? saved : 1;
    layoutPages();
    state.current = 0;
    updateSub();
  }
  function computeFit() {
    const avail = viewer.clientWidth - 32;
    state.fitW = Math.max(240, Math.min(avail, 900));
  }
  function layoutPages() {
    computeFit();
    const doc = state.doc;
    if (!doc) return;
    doc.pages.forEach((p, i) => {
      const w = state.fitW * state.zoom * (p.section.width / state.maxW);
      state.pages[i].style.width = w.toFixed(1) + 'px';
    });
    if (state.noticeEl) state.noticeEl.style.width = Math.min(state.fitW * Math.max(state.zoom, 1), state.fitW).toFixed(0) + 'px';
    $('zoomFit').textContent = Math.abs(state.zoom - 1) < 0.001 ? '맞춤' : Math.round(state.zoom * 100) + '%';
  }
  function setZoom(z, anchor) {
    z = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
    const old = state.zoom;
    if (Math.abs(z - old) < 1e-4) return;
    const rect = viewer.getBoundingClientRect();
    const ax = anchor ? anchor.x - rect.left : viewer.clientWidth / 2;
    const ay = anchor ? anchor.y - rect.top : viewer.clientHeight / 2;
    // 기준점 아래의 문서 위치를 쪽 기준으로 기억했다가 같은 자리로 되돌린다
    const ref = pagePointAt(ax, ay);
    state.zoom = z;
    prefs.set('zoom', String(z));
    layoutPages();
    if (ref) {
      const el = state.pages[ref.i];
      viewer.scrollLeft = el.offsetLeft + ref.fx * el.offsetWidth - ax;
      viewer.scrollTop = el.offsetTop + ref.fy * el.offsetHeight - ay;
    }
  }
  function pagePointAt(ax, ay) {
    const x = viewer.scrollLeft + ax, y = viewer.scrollTop + ay;
    let best = null;
    for (let i = 0; i < state.pages.length; i++) {
      const el = state.pages[i];
      if (y >= el.offsetTop - 7 && y <= el.offsetTop + el.offsetHeight + 7) {
        best = { i, fx: (x - el.offsetLeft) / el.offsetWidth, fy: (y - el.offsetTop) / el.offsetHeight };
        break;
      }
    }
    if (!best && state.pages.length) {
      const el = state.pages[state.current] || state.pages[0];
      best = { i: state.pages.indexOf(el), fx: (x - el.offsetLeft) / el.offsetWidth, fy: (y - el.offsetTop) / el.offsetHeight };
    }
    return best;
  }
  function stepZoom(dir) {
    const z = state.zoom;
    let next = dir > 0 ? ZOOMS.find((v) => v > z + 0.01) : [...ZOOMS].reverse().find((v) => v < z - 0.01);
    if (next === undefined) next = dir > 0 ? MAX_ZOOM : MIN_ZOOM;
    setZoom(next);
  }

  // 지금 보고 있는 쪽
  let rafScroll = 0;
  viewer.addEventListener('scroll', () => {
    if (rafScroll) return;
    rafScroll = requestAnimationFrame(() => {
      rafScroll = 0;
      if (!state.pages.length) return;
      const mid = viewer.scrollTop + viewer.clientHeight * 0.4;
      let cur = 0;
      for (let i = 0; i < state.pages.length; i++) if (state.pages[i].offsetTop <= mid) cur = i;
      if (cur !== state.current) { state.current = cur; updateSub(); }
    });
  }, { passive: true });

  // ------------------------------------------------------------------ 두 손가락 확대, 두 번 눌러 확대
  let pinch = null, lastTap = 0, lastTapPos = null;
  viewer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2 && state.doc) {
      const [a, b] = e.touches;
      pinch = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z0: state.zoom, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2, scale: 1 };
      const rect = viewer.getBoundingClientRect();
      pinch.ox = viewer.scrollLeft + pinch.cx - rect.left;
      pinch.oy = viewer.scrollTop + pinch.cy - rect.top;
      stage.style.transformOrigin = pinch.ox + 'px ' + pinch.oy + 'px';
    }
  }, { passive: true });
  viewer.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const z = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinch.z0 * d / pinch.d0));
    pinch.scale = z / pinch.z0;
    stage.style.transform = `scale(${pinch.scale})`;
  }, { passive: false });
  const endPinch = () => {
    if (!pinch) return;
    const p = pinch;
    pinch = null;
    stage.style.transform = '';
    stage.style.transformOrigin = '';
    if (Math.abs(p.scale - 1) > 0.01) setZoom(p.z0 * p.scale, { x: p.cx, y: p.cy });
  };
  viewer.addEventListener('touchend', (e) => {
    if (pinch && e.touches.length < 2) { endPinch(); return; }
    if (e.changedTouches.length === 1 && e.touches.length === 0 && state.doc) {
      const t = e.changedTouches[0];
      const now = Date.now();
      if (now - lastTap < 300 && lastTapPos && Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y) < 30) {
        e.preventDefault();
        setZoom(state.zoom < 1.5 ? 2 : 1, { x: t.clientX, y: t.clientY });
        lastTap = 0;
      } else { lastTap = now; lastTapPos = { x: t.clientX, y: t.clientY }; }
    }
  });
  viewer.addEventListener('touchcancel', endPinch);
  viewer.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey) || !state.doc) return;
    e.preventDefault();
    setZoom(state.zoom * Math.exp(-e.deltaY * 0.0022), { x: e.clientX, y: e.clientY });
  }, { passive: false });
  viewer.addEventListener('dblclick', (e) => {
    if (!state.doc || e.target.closest('button')) return;
    setZoom(state.zoom < 1.5 ? 2 : 1, { x: e.clientX, y: e.clientY });
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!state.doc) return;
      const ref = pagePointAt(viewer.clientWidth / 2, 0);
      layoutPages();
      if (ref) {
        const el = state.pages[ref.i];
        viewer.scrollTop = el.offsetTop + ref.fy * el.offsetHeight;
      }
    }, 120);
  });

  // ------------------------------------------------------------------ 판(목차·문서함·정보)
  let sheetReturn = null;
  function openSheet(title, bodyHtml, onClick) {
    closeSheet();
    sheetReturn = document.activeElement;
    overlay.innerHTML = `<div class="scrim" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h2 id="sheetTitle">${esc(title)}</h2><button class="icon-btn" type="button" data-act="close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="body">${bodyHtml}</div></section>`;
    overlay.onclick = (e) => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      if (t.dataset.act === 'close') { closeSheet(); return; }
      if (onClick) onClick(t, e);
    };
    const first = overlay.querySelector('.sheet button:not([data-act="close"])') || overlay.querySelector('.sheet button');
    if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() {
    if (!overlay.innerHTML) return;
    overlay.innerHTML = '';
    overlay.onclick = null;
    if (sheetReturn && sheetReturn.focus) sheetReturn.focus({ preventScroll: true });
    sheetReturn = null;
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSheet();
    if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); stepZoom(1); }
    if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); stepZoom(-1); }
    if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); setZoom(1); }
  });

  function showToc() {
    const doc = state.doc;
    if (!doc) { toast('먼저 문서를 열어 주세요.'); return; }
    const items = doc.outline;
    const body = items.length
      ? `<ul class="list toc">${items.map((o, i) => `<li class="lv${Math.min(o.level, 2)}"><button type="button" data-act="go" data-i="${i}"><span class="t">${esc(o.text)}</span><span class="n">${o.page + 1}쪽</span></button></li>`).join('')}</ul>`
      : '<p class="empty">이 문서에서 □ 소제목이나 I. II. 같은 대제목을 찾지 못했습니다.</p>';
    const pages = `<div><h3>쪽으로 가기</h3><ul class="list">${doc.pages.map((p, i) => `<li><button type="button" data-act="page" data-i="${i}"><span class="t">${i + 1}쪽</span><span class="n">${p.pageNum ? '쪽 번호 ' + p.number : '쪽 번호 없음'}</span></button></li>`).join('')}</ul></div>`;
    openSheet('목차', `<div>${body}</div>${doc.pages.length > 1 ? pages : ''}`, (t) => {
      if (t.dataset.act === 'go') {
        const o = items[+t.dataset.i];
        closeSheet();
        scrollToDoc(o.page, o.y);
      } else if (t.dataset.act === 'page') {
        closeSheet();
        scrollToDoc(+t.dataset.i, null);
      }
    });
  }
  function scrollToDoc(pageIndex, y) {
    const el = state.pages[pageIndex];
    if (!el) return;
    const p = state.doc.pages[pageIndex];
    const scale = el.offsetWidth / p.section.width;
    const bodyTop = p.section.margins.top + p.section.margins.header;
    const off = y === null ? -14 : (bodyTop + y) * scale - 24;
    viewer.scrollTop = el.offsetTop + off;
  }

  async function showLibrary() {
    const recent = await store.list();
    const rows = recent.map((r) => `<li class="doc-row"><button type="button" data-act="recent" data-id="${esc(r.id)}"><span class="t">${esc(r.name.replace(/\.hwpx$/i, ''))}<span class="meta">${dateText(r.openedAt)} · ${r.pages ? r.pages + '쪽 · ' : ''}${sizeText(r.size)}</span></span></button><button class="icon-btn" type="button" data-act="forget" data-id="${esc(r.id)}" aria-label="${esc(r.name)} 목록에서 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></li>`).join('');
    const samples = SAMPLES.map((s) => `<li><button type="button" data-act="sample" data-id="${s.id}"><span class="t">${esc(s.name.replace(/\.hwpx$/i, ''))}<span class="meta" style="display:block;color:var(--muted);font-size:12px;margin-top:2px">${esc(s.kind)}</span></span></button></li>`).join('');
    openSheet('문서함', `
      <div><button class="btn primary" type="button" data-act="open" style="width:100%">휴대폰이나 컴퓨터에서 .hwpx 파일 열기</button></div>
      <div><h3>최근에 연 문서</h3>${recent.length ? `<ul class="list">${rows}</ul>` : '<p class="empty">아직 연 문서가 없습니다. 연 문서는 이 기기의 브라우저에만 남고 다른 곳으로 보내지 않습니다.</p>'}</div>
      <div><h3>예시 보고서</h3><ul class="list">${samples}</ul></div>`, async (t) => {
      if (t.dataset.act === 'open') { closeSheet(); pickFile(); }
      else if (t.dataset.act === 'recent') {
        const rec = await store.get(t.dataset.id);
        closeSheet();
        if (rec && rec.data) openBuffer(rec.data, { name: rec.name, id: rec.id });
        else toast('저장해 둔 문서를 찾지 못했습니다. 파일을 다시 열어 주세요.');
      } else if (t.dataset.act === 'forget') {
        await store.remove(t.dataset.id);
        if (prefs.get('last') === t.dataset.id) prefs.set('last', null);
        showLibrary();
      } else if (t.dataset.act === 'sample') {
        closeSheet();
        openSample(t.dataset.id);
      }
    });
  }

  function showInfo() {
    const doc = state.doc;
    if (!doc) { toast('먼저 문서를 열어 주세요.'); return; }
    const p = doc.pages[0];
    const mm = (v) => (v / 7200 * 25.4).toFixed(0);
    const S = p.section;
    const fonts = [...doc.fonts.keys()].filter(Boolean);
    const rows = fonts.map((f) => {
      const sub = HwpxEngine.fontFor(f)[3];
      return `<tr><td>${esc(f)}</td><td class="arrow" aria-hidden="true">→</td><td>${esc(FONT_NAMES[sub] || sub)}</td></tr>`;
    }).join('');
    const warns = [...doc.warnings];
    openSheet('문서 정보', `
      <dl class="facts">
        <dt>파일</dt><dd>${esc(state.name)}</dd>
        <dt>쪽수</dt><dd>${doc.pages.length}쪽</dd>
        <dt>용지</dt><dd>${paperName(S)} (${mm(S.width)}×${mm(S.height)}mm)</dd>
        <dt>여백</dt><dd>위 ${mm(S.margins.top)} · 아래 ${mm(S.margins.bottom)} · 왼쪽 ${mm(S.margins.left)} · 오른쪽 ${mm(S.margins.right)}mm</dd>
      </dl>
      <div><h3>글꼴</h3><table class="fonts"><tbody>${rows || '<tr><td>글꼴 정보 없음</td></tr>'}</tbody></table></div>
      <div><h3>이렇게 보여 줍니다</h3><p class="note">줄이 어디서 바뀌는지, 문단과 표가 몇 쪽에 놓이는지는 한컴 글꼴의 글자 폭 자료로 한글과 같은 규칙에 따라 계산합니다. 휴대폰에는 한컴 글꼴이 없어서 글자 모양만 위의 무료 글꼴로 대신 그립니다. 그래서 획 모양은 조금 달라도 줄 바꿈 위치와 들여쓰기는 한글 화면에 맞춥니다. 드물게 한 줄 정도 어긋날 수 있으니 결재 전 최종 확인은 한글 프로그램에서 해 주세요.</p></div>
      ${warns.length ? `<div><h3>단순하게 그린 부분</h3><ul class="warn">${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
      <p class="note" style="font-size:12px">글자 폭 자료와 배치 규칙: python-hwpx 6.10.0(Apache License 2.0)에서 옮김. 글꼴: 나눔명조·나눔고딕(NHN)에서 필요한 글자만 담아 이름을 바꾼 판, 본고딕(Noto Sans KR), 모두 SIL OFL 1.1. 압축 풀기: JSZip(MIT). 파일은 이 기기 안에서만 읽고 어디로도 보내지 않습니다.</p>`);
  }

  function toast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ------------------------------------------------------------------ 파일 고르기·끌어 놓기
  const input = $('fileInput');
  function pickFile() { input.value = ''; input.click(); }
  input.addEventListener('change', async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    openFile(f);
  });
  async function openFile(f) {
    try {
      const buf = await f.arrayBuffer();
      openBuffer(buf, { name: f.name || '문서.hwpx' });
    } catch (e) {
      showError({ message: '파일을 읽지 못했습니다. 다시 골라 주세요.', code: 'READ' }, f.name);
    }
  }
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    if (!document.querySelector('.drop')) {
      const d = document.createElement('div');
      d.className = 'drop';
      d.textContent = '여기에 놓으면 문서를 엽니다';
      document.body.appendChild(d);
    }
  });
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) { const d = document.querySelector('.drop'); if (d) d.remove(); }
  });
  window.addEventListener('drop', (e) => {
    const d = document.querySelector('.drop');
    if (d) d.remove();
    dragDepth = 0;
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    openFile(f);
  });

  async function openSample(id) {
    const s = SAMPLES.find((x) => x.id === id) || SAMPLES[0];
    try {
      let b64 = s.inline;
      if (!b64) {
        showLoading(s.name);
        const r = await fetch(s.url);
        if (!r.ok) throw new Error('예시 문서를 불러오지 못했습니다');
        b64 = (await r.json()).data;
      }
      await openBuffer(b64ToBuffer(b64), { name: s.name, sample: s.id });
    } catch (e) {
      showError({ message: '예시 문서를 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.', code: 'SAMPLE' }, s.name);
    }
  }

  // ------------------------------------------------------------------ 단추
  $('openBtn').addEventListener('click', pickFile);
  $('tocBtn').addEventListener('click', showToc);
  $('libBtn').addEventListener('click', showLibrary);
  $('infoBtn').addEventListener('click', showInfo);
  $('zoomIn').addEventListener('click', () => stepZoom(1));
  $('zoomOut').addEventListener('click', () => stepZoom(-1));
  $('zoomFit').addEventListener('click', () => setZoom(1));
  stage.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    if (t.dataset.act === 'open') pickFile();
    if (t.dataset.act === 'sample') openSample('sample-review');
  });

  // ------------------------------------------------------------------ 시작: 마지막에 본 문서, 없으면 예시
  window.HwpxViewer = { openFile, openBuffer, toast, hasDoc: () => !!state.doc };
  (async function start() {
    // 설치형 앱은 공유받은 파일 등을 먼저 연다(HWPX_BOOT가 true를 돌려주면 끝)
    try { if (window.HWPX_BOOT && (await window.HWPX_BOOT(window.HwpxViewer))) return; } catch (e) { /* 그냥 시작 */ }
    const last = prefs.get('last');
    if (last && !last.startsWith('sample-')) {
      const rec = await store.get(last);
      if (rec && rec.data) { await openBuffer(rec.data, { name: rec.name, id: rec.id }); if (state.doc) return; }
    }
    await openSample(last && last.startsWith('sample-') ? last : 'sample-review');
  })();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { /* 글꼴이 들어오면 SVG 글자가 저절로 바뀐다 */ });
})();
</script>
</body>
</html>
